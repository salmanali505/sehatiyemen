<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>صحتي | بدون إنترنت</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: Tajawal, Cairo, system-ui, sans-serif; text-align: center;
        background: linear-gradient(160deg, #eaf4ff, #ffffff 60%, #eafff2);
        color: #0b2447; padding: 24px;
      }
      img { width: 128px; height: 128px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0,102,255,.25)); }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { font-size: 14px; color: #4a5b73; margin: 0 0 20px; line-height: 1.8; }
      button {
        border: 0; border-radius: 18px; padding: 14px 28px; font-size: 15px; font-weight: 800; color: #fff;
        background: linear-gradient(135deg, #0066ff, #00c389); box-shadow: 0 10px 24px rgba(0,102,255,.3);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-512.png" alt="صحتي" />
      <h1>أنت الآن بدون إنترنت</h1>
      <p>
        يمكنك تصفح ما تم حفظه مسبقاً داخل التطبيق.<br />
        سيتم إرسال أي حجز أنشأته تلقائياً عند عودة الاتصال.
      </p>
      <button onclick="location.replace('/')">إعادة المحاولة</button>
    </main>
  </body>
</html>
